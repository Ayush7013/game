<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <style>
    body{
      background-color: rgb(25,25,25);
      color: white;
      font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    .icon{
      background-color:  rgb(25,25,25);
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }
    .resize{
      height: 45px;
    }

    .result , .moves , .score{
      font-weight: bold;
      font-size: 20px;
    }
    .reset{
      padding: 7px 10px;
      font-size: 18px;
      font-weight: bold;
      background-color: rgb(25,25,25);
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

    <h1>Rock Paper Scissors</h1>
    <button class="icon" onclick="
      playGame('rock');
    "><img src="images/rock-emoji.png" alt="rock" class="resize">
    </button>

    <button class="icon" onclick="
      playGame('paper');
    "><img src="images/paper-emoji.png" alt="paper" class="resize" >
    </button>

    <button class="icon" onclick="
      playGame('scissors');
    "><img src="images/scissors-emoji.png" alt="scissors" class="resize">
    </button>
     
    <p class="result"></p>
    <p class="moves" ></p>
    <p class="score"></p>

    <script>
      let score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
      };

      updateScoreElement();
      /*
      if (!score) {
        score = {
          wins: 0,
          losses: 0,
          ties: 0
        };
      }
      */

      function playGame(playerMove) {
        const computerMove = pickComputerMove();

        let result = '';

        if (playerMove === 'scissors') {
          if (computerMove === 'rock') {
            result = 'You lose.';
          } else if (computerMove === 'paper') {
            result = 'You win.';
          } else if (computerMove === 'scissors') {
            result = 'Tie.';
          }

        } else if (playerMove === 'paper') {
          if (computerMove === 'rock') {
            result = 'You win.';
          } else if (computerMove === 'paper') {
            result = 'Tie.';
          } else if (computerMove === 'scissors') {
            result = 'You lose.';
          }
          
        } else if (playerMove === 'rock') {
          if (computerMove === 'rock') {
            result = 'Tie.';
          } else if (computerMove === 'paper') {
            result = 'You lose.';
          } else if (computerMove === 'scissors') {
            result = 'You win.';
          }
        }

        if (result === 'You win.') {
          score.wins += 1;
        } else if (result === 'You lose.') {
          score.losses += 1;
        } else if (result === 'Tie.') {
          score.ties += 1;
        }

        localStorage.setItem('score', JSON.stringify(score));

        updateScoreElement();

        document.querySelector('.result').innerHTML = result;

        document.querySelector('.moves').innerHTML = ` You chose <img src="images/${playerMove}-emoji.png" alt="" class="resize"> - 
      Computer chose <img src="images/${computerMove}-emoji.png" alt="" class="resize">`
      }

      function updateScoreElement() {
        document.querySelector('.score')
          .innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
      }

      function pickComputerMove() {
        let randomNumber = Math.random();

        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'paper';
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = 'scissors';
        }

        return computerMove;
      }
    </script>


    <button class="reset" onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreElement();
    ">Reset Score</button>

  </body>
</html>
